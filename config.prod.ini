; Inotia 4 for Nintendo Switch -- runtime configuration
; Edit freely; nothing here requires rebuilding the NRO.
; Unknown keys are ignored, missing keys fall back to the defaults below.

[display]
; 0 = follow the console (1280x720 handheld, see dock_1080p when docked)
; or pin an explicit target, e.g. 1280x720 or 960x540 for more speed
screen_width = 0
screen_height = 0
; 1920x1080 while docked. Mesa's software rasteriser is fill-rate bound, so
; set this to 0 if the frame rate drops in TV mode.
dock_1080p = 1

[game]
; 0 = let the engine use the console language, otherwise the engine's own
; language index (1 en, 2 jp, 3 fr, 4 de, 5 zhhans, 6 zhhant)
language = 0
; the port has no h264 decoder, so the H7.mp4 intro can only be skipped
skip_intro = 1

[audio]
; audout output rate; 48000 matches the game's ogg assets
audio_frequency = 48000
; buffer length in samples (256..4096). Raise it if the music stutters,
; lower it if the sound lags behind the picture.
audio_latency = 1024
music_volume = 80
sfx_volume = 90

[input]
auto_no = 1
overlay = 0
; The game is touch-only, so the pad drives a virtual finger: the stick moves a
; crosshair, A (or ZR) presses where it is, B releases. A real finger on the
; touchscreen is forwarded straight through. inject = 0 turns all of that off.
inject = 1
; virtual stick origin and action-spot distance, percent of the view
touch_x_pct = 12
touch_y_pct = 78
button_pct = 18
; The 6 quick-slot buttons (HUD control ids 8..13) as "x,y" pairs in the
; engine's 1137x640 layout, in id order. Default: ids 8..11 form an EXACT
; cross on the right (centre 985,515, radius 80), ids 12/13 at the lower
; left. Both the in-game HUD (ids 8..13) and the shortcut-assign page's
; six slots (matched by their event proc, ids are dynamic) use these. The
; d-pad / action disc still ignore screen touches EXCEPT on these six buttons
; (input.c hud_touch_blocked() exemption), so shortcuts can be assigned
; there. R shoulder now swaps ONLY the right-hand 4 slots (lower-left 2
; fixed); the page-swap icon and its screen touch are disabled.
; Pad: d-pad Left/Right = the lower-left two; RT + X/Y/A/B = the right-hand
; four (up/left/right/down). Set 0 for the original diagonal arc.
quick_layout = 1
quick_pos = "945,395; 865,475; 1025,475; 945,555; 20,530; 120,530"

[debug]
; 1 = drop the HUD quads in the lower-left pad corner (the
; gold rune ring that lights up while walking). RETIRED: this GL-level
; interception stalled the frame loop, so it stays 0. The wheel is now
; suppressed at its draw call instead -- see no_pad_art.
hide_pad_zone = 0
; 1 = A/B tap the real 确认 / × / skip controls on pages.
; Set 0 to fall back to the old key handler.
tap_buttons = 1
; 1 = forward the real mirror arg to GRPX_DrawPartFlip.
; Set 0 if the inventory icons look wrong.
flip_arg = 1
; RETIRED: hud_blit_hidden() (drop any blit inside the pad rectangle) is a
; no-op now. It was a screen-region mask and it ate page icons. Keep 1.
hud_page_filter = 1
; 1 = do not draw the virtual direction wheel / attack disc / touch
; feedback at all (suppressed inside UIPlayPorting_Draw's key loop).
; Set 0 to bring them back.
no_pad_art = 1
; 1 = log every quad that lands in the virtual pad corner while a
; direction is held; 2 = also drop them. Bring-up only, keep 0.
pad_probe = 0
force_sgl_size = 0
draw_log = 0
tap_test2 = 0
redraw_probe = 0
calib = 0
shot_every_frames = 0
shot_every = 0
shot_after = 0
tap_test = 0
; 0 off, 1 startup + errors, 2 + every file the engine opens, 3 everything
log_level = 1
show_fps = 0
; Fill the engine's own glyph atlas with FreeType text, so the string-image
; screens (prologue, tutorial hint, dialog bodies) actually show words.
; 0 restores the old "black bar, no text" behaviour, which is the quickest A/B.
string_draw = 1
# text controls: 0 = centre the ink on the anchor the engine gives (correct),
# any other value = that many pixels of offset (negative = up) for tuning.
textctrl_dy = 0
# height the tutorial hint's highlight bar is drawn at (engine draws it 20).
# 0 = leave the engine alone.
bar_h = 34
; log the 15 text entry points the port does not replace (see README)
text_trace = 0
; log atlas-draw / per-frame GL state; very noisy, bring-up only
gl_probe = 0
; scripted taps for unattended testing, framebuffer pixels:
;   tap_script = "960,919@600; 959,279@1200"
tap_script = ""
; libHercules.so is only loaded by the Java shell, and 78 of its imports have no
; stand-in here, so it stays out unless you are specifically chasing it
load_hercules = 0
; Com2uS's Protection layer checks processes and calls s.com2us.net; offline it
; always fails and the failure path is "show dialog and exit". Keep it off.
skip_drm = 1

[paths]
; override only if you move things around; relative names are resolved
; against the folder holding the NRO
; data_dir = sdmc:/switch/inotia4/data
; save_dir = sdmc:/switch/inotia4/save
